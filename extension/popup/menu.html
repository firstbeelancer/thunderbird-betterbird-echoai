<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
  <meta charset="utf-8">
  <title>EchoAI</title>
  <link rel="stylesheet" href="../shared/design.css">
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <div class="menu-shell">
    <header class="menu-header">
      <div class="menu-brand">
        <img src="../icons/echoai.svg" alt="" class="brand-logo" width="22" height="22">
        <div class="brand-meta">
          <span class="brand-name">EchoAI</span>
          <span id="modelBadge" class="brand-model">Не настроено</span>
        </div>
      </div>
      <button id="openOptionsBtn" class="btn btn-ghost btn-icon" title="Настройки EchoAI" aria-label="Настройки EchoAI"></button>
    </header>

    <div id="setupNotice" class="setup-notice" hidden>
      <div class="setup-notice-body">
        <span id="setupNoticeIcon" class="setup-notice-icon"></span>
        <span>Подключите API-ключ и модель в настройках, чтобы начать работу.</span>
      </div>
      <button id="setupNoticeBtn" class="btn btn-primary btn-sm">Настроить</button>
    </div>

    <div id="errorBox" class="error-box" hidden></div>

    <nav id="menuList" class="menu-list" aria-label="Действия EchoAI"></nav>

    <footer class="menu-footer">
      <span id="shieldIcon" class="footer-icon"></span>
      <span>Только по вызову · без фонового доступа</span>
    </footer>
  </div>

  <script type="module" src="menu.js"></script>
</body>
</html>
